[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proloaf"
version = "0.3.1"
authors = [
    { name = "Institute for Automation of Complex Power Systems (ACS), E.ON Energy Research Center (E.ON ERC), RWTH Aachen University", email = "post_acs@eonerc.rwth-aachen.de" },
    { name = "Gonca Gürses-Tran", email = "gguerses@eonerc.rwth-aachen.de" },
    { name = "Florian Oppermann", email = "florian.oppermann@eonerc.rwth-aachen.de" },
]
description = "A Probabilistic Load Forecasting Project."
readme = "README.md"
license = { text = "Apache License 2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = [
    "arch~=7.0.0",
    "datetime~=5.5",
    "holidays~=0.77",
    "matplotlib~=3.9.1",
    "numpy~=2.0.0",
    "optuna~=3.6.1",
    "pandas~=2.2.2",
    # "pmdarima~=2.0",
    "pyparsing~=2.4.7",
    "scikit-learn~=1.5",
    "statsmodels~=0.14.2",
    "tensorboard~=2.18.0",
    # "tb-nightly",
    "torch~=2.5.1",
    "holidays~=0.58"
]

[project.optional-dependencies]
tutorial = ["jupyter"]
dev = ["ruff", "pre-commit"]

[project.urls]
GitHub = "https://github.com/sogno-platform/proloaf"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

# Ruff configuration (replaces flake8, isort, pyupgrade, black)
[tool.ruff]
line-length = 120
target-version = "py39"
# Don't exclude notebooks - we want to lint them too, just with different rules

# Enable specific rule sets
[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modernize Python code)
    "B",     # flake8-bugbear (find likely bugs)
    "C4",    # flake8-comprehensions
]

# Ignore errors (most formatting issues handled by ruff-format)
ignore = [
    "E501",  # Line too long (handled by formatter)
    "UP007", # Upgrade typehints from Union[] to |
]

# Per-file ignores - different rules for different file types
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"notebooks/**/*.ipynb" = [
    "E402",  # Module level import not at top
]

[tool.ruff.lint.isort]
known-first-party = ["proloaf"]

[tool.ruff.format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"
line-ending = "auto"
